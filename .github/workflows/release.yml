name: Build and release
on:
  push:
    branches: [main]
    paths: ['YukaBypass.m', 'YukaFirebaseConfig.h', 'build.sh', 'package.py', 'control', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS 14 rootful tweak
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YukaApp-Bypass-iOS14
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.5 packages/*.deb --target "$GITHUB_SHA" --title "Yuka Bypass iOS 14 1.0.5" --notes "Updates the Firebase API key and storage bucket to match the supplied working Yuka 5.3 app. Also replaces the old key in Google API requests. Install, fully close and reopen Yuka, then test history and scanning. Includes diagnostics if the error remains. Device testing required."
