name: Build and release
on:
  push:
    branches: [main]
    paths: ['YukaCompat.m', 'YukaFirebaseConfig.h', 'build.sh', 'package.py', 'control', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS 14 rootful tweak
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YukaApp-Bypass-iOS14
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 packages/*.deb --target "$GITHUB_SHA" --title "Yuka Bypass iOS 14 1.1.0" --notes "Focused Firebase compatibility test. Yuka 4.38 is left reporting its real app version. No FIROptions or storage hooks are used. Firebase reads the original 4.38 GoogleService configuration with only the client API key substituted to the value used by Yuka 5.3. Test History and product scanning."
