name: Build and release
on:
  push:
    branches: [main]
    paths: ['YukaRepair.m', 'YukaGRPCCompat.m', 'YukaGRPCTLSWrappers.S', 'YukaFirebaseConfig.h', 'build.sh', 'package.py', 'control', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS 14 rootful repair
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YukaApp-Bypass-iOS14
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release and remove old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^Version: //p' control)
          current="v$version"

          # Keep the repository clean: remove every older release and its tag.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" != "$current" ]; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

          # Create the current release only when it does not already exist.
          if ! gh release view "$current" >/dev/null 2>&1; then
            gh release create "$current" packages/*.deb --target "$GITHUB_SHA" --title "Yuka Repair iOS 14 $version" --notes-file RELEASE_NOTES.md
          fi
