name: Build and release
on:
  push:
    branches: [main]
    paths: ['YukaBypass.m', 'build.sh', 'package.py', 'control', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS 14 rootful tweak
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YukaApp-Bypass-iOS14
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.3 packages/*.deb --target "$GITHUB_SHA" --title "Yuka Bypass iOS 14 1.0.3" --notes "Spoofs Yuka 5.3 and its actual build 2654 on iOS 14 rootful. Forces the version header on the confirmed Yuka API hosts. Shows a Yuka 1.0.3 Info button to confirm injection. Scan a product, tap Info, and screenshot the results. Shows HTTP status and response shape without account tokens. This is not a confirmed fix."
