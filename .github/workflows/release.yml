name: Build and release
on:
  push:
    branches: [main]
    paths: ['YukaBypass.m', 'YukaFirebaseConfig.h', 'YukaFirebaseKeyGetter.m', 'build.sh', 'package.py', 'control', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS 14 rootful tweak
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YukaApp-Bypass-iOS14
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.8 packages/*.deb --target "$GITHUB_SHA" --title "Yuka Bypass iOS 14 1.0.8" --notes "Focused Firestore compatibility test. Keeps the safe 5.3 app/build and request spoof, and adds only a read-only FIROptions APIKey getter override so Firebase/Firestore can see the current Yuka 5.3 client key. It does not restore the setter or storage-bucket hooks that caused the 1.0.5 launch regression. Packaging now derives the .deb filename from the control version. Device testing required."
