name: Build and release
on:
  push:
    branches: [main]
    paths: ['YukaSpoof.m', 'YukaFirebaseConfig.h', 'build.sh', 'package.py', 'control', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS 14 rootful tweak
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YukaApp-Bypass-iOS14
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 packages/*.deb --target "$GITHUB_SHA" --title "Yuka Bypass iOS 14 2.0.0" --notes "Clean restart build. Spoofs Yuka 4.38 as Yuka 5.3 build 2654 and iOS 16.2, applies the exact API compatibility versions recovered from Yuka 5.3 (food 17, cosmetics 4, Algolia 3, OCR 2), updates Yuka request identity, and rewrites the old Firebase client key only on outgoing Google requests. No FIROptions or GoogleService plist hooks are used."
