name: Build and release
on:
  push:
    branches: [main]
    paths: ['YukaBypass.m', 'YukaFirebaseConfig.h', 'build.sh', 'package.py', 'control', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS 14 rootful tweak
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YukaApp-Bypass-iOS14
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.6 packages/*.deb --target "$GITHUB_SHA" --title "Yuka Bypass iOS 14 1.0.6" --notes "Recovery build: removes the Firebase options and storage hooks introduced in 1.0.5. Updates the old API key only in outgoing Google requests and shows a replacement count in Info. Install over 1.0.5 and reopen Yuka. Device testing required."
