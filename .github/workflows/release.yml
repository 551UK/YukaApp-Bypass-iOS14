name: Build and release
on:
  push:
    branches: [main]
    paths: ['YukaLaunchDiag.m', 'build.sh', 'package.py', 'control', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS 14 rootful diagnostic
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YukaApp-Bypass-iOS14
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.1 packages/*.deb --target "$GITHUB_SHA" --title "Yuka Launch Diagnostic iOS 14 2.0.1" --notes "Diagnostic-only build. Does not spoof Yuka, iOS, Firebase, Remote Config, or network requests. Logs launch stages, Remote Config keys, Objective-C exceptions, and explicit exit/abort/self-kill calls so the current Yuka 4.38 launch failure can be identified before another compatibility patch is attempted."
