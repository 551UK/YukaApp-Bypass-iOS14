name: Build and release
on:
  push:
    branches: [main]
    paths: ['YukaBypass.m', 'YukaFirebaseConfig.h', 'YukaFirebaseKeyGetter.m', 'build.sh', 'package.py', 'control', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed iOS 14 rootful tweak
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YukaApp-Bypass-iOS14
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.7 packages/*.deb --target "$GITHUB_SHA" --title "Yuka Bypass iOS 14 1.0.7" --notes "Targets the Firestore OFFLINE failure without restoring the launch-breaking 1.0.5 hooks. Adds only a read-only FIROptions APIKey getter override so Firebase/Firestore sees the Yuka 5.3 client key. No Firebase setters or storage bucket hooks. Keeps the 5.3 app/build spoof and outgoing Google request rewrite. Device testing required."
